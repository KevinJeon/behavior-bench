min_gap = 1.0
headway_time = 1.5
accel_max = 1.0
decel_max = 3.0

[traffic.smart]
weights_path =
device = cuda
temperature = 1.0
greedy = True
repredict_interval = 5

[traffic.expert]

[traffic.constant_velocity]

[traffic.conditioned_mix]
