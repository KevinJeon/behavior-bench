; Paper-exact MLP architecture (Gigaflow Appendix D) WITHOUT reward conditioning,
; classic dynamics (accel + steering), discrete action space.
;
; - Policy class: DrivePaper
; - No RNN (paper is fully feedforward).
; - Rewards and goal settings taken from drive.ini (simple reward).

[base]
package = ocean
env_name = puffer_drive
policy_name = DrivePaper
rnn_name = None

[vec]
num_workers = 16
num_envs = 16
batch_size = 4

[policy]
input_size = 128
hidden_size = 1024

[env]
ini_file = "pufferlib/config/ocean/drive_gigaflow_paper_classic_simple.ini"
num_agents = 1024
action_type = discrete
dynamics_model = classic
dt = 0.1
collision_shrink = 0.7
episode_length = 91
resample_frequency = 910
split = "training"
termination_mode = 1
num_maps = 10000
init_steps = 0
control_mode = "control_vehicles"
init_mode = "create_all_valid"
idm_others = False
max_controlled_agents = -1
max_obs_partners = 31
mix_traffic = False
ppo_fraction = 1.0
idm_fraction = 0.0
expert_fraction = 0.0
idm_target_velocity = 15.0
idm_random_velocity = False

; --- Reward conditioning disabled ---
reward_conditioning = 0

; Goal reward (from drive.ini)
reward_goal = 1.0
reward_goal_post_respawn = 0.25
goal_radius = 2.0
goal_speed = 100.0
goal_behavior = 3
goal_target_distance = 30.0

; Collision & offroad penalties (from drive.ini — simple, milder)
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
collision_behavior = 2
offroad_behavior = 2

; Speed limit penalty (per step when speed > 15 m/s)
reward_speed_limit = 0.0

; Simple reward coefficients (from drive.ini)
reward_comfort = 0.0
reward_l_align = 0.0
reward_l_align_vel = 0.0
reward_l_center = 0.0
reward_l_center_bias = 0.0
reward_reverse = 0.0
reward_timestep = 0.0
reward_velocity = 0.0

reward_lane_alignment = 0.0
reward_lane_distance = 0.0

[train]
seed = 42
total_timesteps = 100_000_000_000
anneal_lr = True
batch_size = 524288
minibatch_size = 32768
max_minibatch_size = 32768
bptt_horizon = 32
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.005
gae_lambda = 0.95
gamma = 0.98
; LR from drive.ini.
learning_rate = 0.003
max_grad_norm = 1
prio_alpha = 0.8499999999999999
prio_beta0 = 0.8499999999999999
update_epochs = 1
advantage_filtering = True
advantage_filter_threshold = 0.01
advantage_filter_ewma_beta = 0.25
vf_clip_coef = 0.1999999999999999
vf_coef = 2
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 1000
teacher_only = False
teacher_bc_kl_coef = 0.01
bc_weights_path =
kl_coef = 0.1
smart_ref_weights_path =
smart_ref_shift = 5
humanlike_coef = 0.1
opponent_pool = False
opponent_pool_fraction = 0.25
opponent_pool_snapshot_interval = 100
opponent_pool_max_snapshots = 20
opponent_pool_warmup_epochs = 100
render = False
render_interval = 1000
obs_only = True
show_grid = True
show_lasers = False
show_human_logs = False
zoom_in = True
render_map = none

[eval]
eval_interval = 1000
split = "training"
num_maps = 20
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
human_replay_eval = False
human_replay_control_mode = "control_sdc_only"
