[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
rnn_name = Recurrent

[vec]
num_workers = 16
num_envs = 16
batch_size = 4

[policy]
input_size = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[env]
ini_file = "pufferlib/config/ocean/drive_gigaflow_pbt.ini"
num_agents = 1024
action_type = discrete
dynamics_model = jerk
dt = 0.1
collision_shrink = 1.0
episode_length = 91
resample_frequency = 910
split = "training"
termination_mode = 1
num_maps = 10000
init_steps = 0
control_mode = "control_vehicles"
init_mode = "create_all_valid"
idm_others = False
max_controlled_agents = -1
max_obs_partners = 31
mix_traffic = False
ppo_fraction = 1.0
idm_fraction = 0.0
expert_fraction = 0.0
idm_target_velocity = 15.0
idm_random_velocity = False

; --- Reward configuration (GIGAFLOW-inspired, all off by default) ---

; Goal reward
reward_goal = 1.0
reward_goal_post_respawn = 0.25
goal_radius = 10.0
goal_speed = 3.0
goal_behavior = 3
goal_target_distance = 30.0

; Collision & offroad penalties
reward_vehicle_collision = -3.0
reward_offroad_collision = -3.0
collision_behavior = 2
offroad_behavior = 2

; Speed limit penalty (per step when speed > 15 m/s)
reward_speed_limit = 0.0

; R_velocity = alpha * dt * max(cos(theta_f), 0) * 1_{|v|>2.5}
; Encourages forward progress along lanes. GIGAFLOW: 2.5e-3
reward_velocity = 0.0025

; R_comfort = -alpha * (1_{|a_long|>3} + 1_{|a_lat|>3} + 1_{|jerk|>5})
; Penalizes harsh acceleration and jerk. GIGAFLOW: U(0, 0.1), mid=0.05
reward_comfort = 0.05

; R_l-align = alpha * dt * (min(cos(theta_f),0) + alpha_vel*min(cos(theta_f)*v,0) + 0.0025*(1-|theta_f|/(pi/2)))
; Penalizes driving against lane direction, small bonus for alignment.
reward_l_align = 0.025
reward_l_align_vel = 1.0

; R_l-center = -alpha * dt * (1_{cos(theta_f)>0.5} * |x_f - bias| - 0.05/exp(|x_f - bias|-0.5))
; Penalizes lateral deviation from lane center. GIGAFLOW: alpha=3.8e-3, bias=0 (eval)
reward_l_center = 0.0038
reward_l_center_bias = 0.0

; R_reverse = -alpha * dt * 1_{v_long<0}
; Penalizes reversing along heading direction. GIGAFLOW eval: 5e-3
reward_reverse = 0.005

; R_timestep = -(alpha * dt) * 1_{|v|>0 or |a|>0}
; Small per-step cost when moving. GIGAFLOW: 2.5e-5
reward_timestep = 0.000025

; Legacy jerk smoothness penalty (hardcoded historically, not in GIGAFLOW paper). 0.0 disables.
reward_jerk_legacy = 0.0

; Legacy rewards (kept for backward compatibility, use GIGAFLOW rewards above instead)
reward_lane_alignment = 0.0
reward_lane_distance = 0.0

[train]
seed = 42
total_timesteps = 2_000_000_000
anneal_lr = True
batch_size = 524288
minibatch_size = 32768
max_minibatch_size = 32768
bptt_horizon = 32
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.005
gae_lambda = 0.95
gamma = 0.98
learning_rate = 0.003
max_grad_norm = 1
prio_alpha = 0.8499999999999999
prio_beta0 = 0.8499999999999999
update_epochs = 1
advantage_filtering = True
advantage_filter_threshold = 0.01
advantage_filter_ewma_beta = 0.25
vf_clip_coef = 0.1999999999999999
vf_coef = 2
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 1000
teacher_only = False
teacher_bc_kl_coef = 0.01
bc_weights_path =
kl_coef = 0.1
smart_ref_weights_path =
smart_ref_shift = 5
humanlike_coef = 0.1
opponent_pool = False
opponent_pool_fraction = 0.25
opponent_pool_snapshot_interval = 100
opponent_pool_max_snapshots = 20
opponent_pool_warmup_epochs = 100
render = False
render_interval = 1000
obs_only = True
show_grid = True
show_lasers = False
show_human_logs = False
zoom_in = True
render_map = none
use_pbt = False 
; Check for using pbt

[eval]
eval_interval = 1000
split = "training"
num_maps = 20
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
human_replay_eval = False
human_replay_control_mode = "control_sdc_only"

[pbt]
pbt_mode = "replay" 
; reactive, replay, save-population
population_path= "/data/puffer/popul_lane_nominal/"
ego_ratio = 0.0
; save-population: total rollouts (parallel jobs must agree). CLI: --pbt.num-collect-rollout
num_collect_rollout = 50
; save-population: shard [collect_start_idx, collect_end_idx). CLI: --pbt.collect-start-idx --pbt.collect-end-idx
collect_start_idx = 0
collect_end_idx = 50
