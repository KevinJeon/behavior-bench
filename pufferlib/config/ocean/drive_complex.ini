[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
rnn_name = Recurrent

[vec]
num_workers = 16
num_envs = 16
batch_size = 4
; backend = Serial

[policy]
input_size = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[env]
num_agents = 1024
; Options: discrete, continuous
action_type =  discrete
; Options: classic, jerk
dynamics_model = classic
reward_conditioning = 0
reward_vehicle_collision = -3.0
reward_offroad_collision = -3.0
reward_speed_limit = 0.0
reward_lane_alignment = 0.0
reward_lane_distance = 0.0

reward_comfort = 0.05
reward_l_align = 0.025
reward_l_align_vel = 1.0
reward_l_center = 0.0038
reward_l_center_bias = 0.0
reward_reverse = 0.005
reward_timestep = 0.000025
reward_velocity = 0.0025

dt = 0.1
collision_shrink = 1.0
reward_goal = 1.0
reward_goal_post_respawn = 0.25
; Meters around goal to be considered "reached"
goal_radius = 2.0
; Max target speed in m/s for the agent to maintain towards the goal
goal_speed = 100.0
; What to do when the goal is reached. Options: 0:"respawn", 1:"generate_new_goals", 2:"stop", 3: "remove"
goal_behavior = 3
; Determines the target distance to the new goal in the case of goal_behavior = generate_new_goals.
; Large numbers will select a goal point further away from the agent's current position.
goal_target_distance = 30.0
; Options: 0 - Ignore, 1 - Stop, 2 - Remove
collision_behavior = 2
; Options: 0 - Ignore, 1 - Stop, 2 - Remove
offroad_behavior = 2
; Number of steps before
episode_length = 91 # last step is always masked out, since no future timestep for value estimation is there -> can be adapted using current timestep if wantedvalid_mask | truncations
resample_frequency = 910
; map_dir = "resources/drive/binaries/training" -> REMOVED DUE TO DIFFERENT FOLDER HANDLING
split = "training"
termination_mode = 1 # 0 - terminate at episode_length, 1 - terminate after all agents have been reset
num_maps = 10000
; Determines which step of the trajectory to initialize the agents at upon reset
init_steps = 0
; Options: "control_vehicles", "control_agents", "control_wosac", "control_sdc_only"
control_mode = "control_vehicles"
; Options: "created_all_valid", "create_only_controlled"
init_mode = "create_all_valid"
; If True, all agents except the first max_controlled_agents per sub-env use IDM for movement
idm_others = False
; Number of PPO-controlled agents per sub-env when idm_others=True (-1 = all agents)
max_controlled_agents = -1
; Max partner agents visible in observation (closest N by distance)
max_obs_partners = 31
; Mixed traffic: each agent is randomly assigned PPO/IDM/Expert per fraction
mix_traffic = False
ppo_fraction = 1.0
idm_fraction = 0.0
expert_fraction = 0.0
; Default IDM target velocity [m/s]
idm_target_velocity = 15.0
; If True, sample IDM velocity from {10,15,20,30} per agent (training only)
idm_random_velocity = False

[train]
seed=42
total_timesteps = 100_000_000_000
; learning_rate = 0.02
; gamma = 0.985
anneal_lr = True
; Needs to be: num_agents * num_workers * BPTT horizon
batch_size = 524288 # 1490944 # 1507328 (92) # 524288
minibatch_size = 32768 # 30940 # 29440 # 32768 # must be divisible by bptt_horizon
max_minibatch_size = 32768 # 30940 # 29440 (92)# 32768 # must be divisible by bptt_horizon
bptt_horizon = 32 # 91 #32 # same as for episode_length _> last step is masked out for training, since there is no future timestep vor value estimation (needed for advantage calculation)
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.005
gae_lambda = 0.95
gamma = 0.98
learning_rate = 0.003
max_grad_norm = 1
prio_alpha = 0.8499999999999999
prio_beta0 = 0.8499999999999999
update_epochs = 1
vf_clip_coef = 0.1999999999999999
vf_coef = 2
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 1000
; Teacher-only mode: train teacher PPO + BC KL, skip student distillation
teacher_only = False
; BC KL coefficient for teacher loss (only used when teacher_only=True)
teacher_bc_kl_coef = 0.01
; Path to frozen BC reference model (DriveNoGoal MLP, no LSTM)
bc_weights_path =
; SPACeR KL regularization with SMART reference model
kl_coef = 0.1
smart_ref_weights_path = 
smart_ref_shift = 5
humanlike_coef = 0.1
; Opponent pool: train against historical policy snapshots for robustness
opponent_pool = False
opponent_pool_fraction = 0.25
opponent_pool_snapshot_interval = 100
opponent_pool_max_snapshots = 20
opponent_pool_warmup_epochs = 100
; Rendering options
render = False
render_interval = 1000
; If True, show exactly what the agent sees in agent observation
obs_only = True
; Show grid lines
show_grid = True
; Draws lines from ego agent observed ORUs and road elements to show detection range
show_lasers = False
; Display human xy logs in the background
show_human_logs = False
; If True, zoom in on a part of the map. Otherwise, show full map
zoom_in = True
; Options: List[str to path], str to path (e.g., "resources/drive/training/binaries/map_001.bin"), None
render_map = none

[eval]
eval_interval = 1000
; Path to dataset used for evaluation -> changed to custom handling
; map_dir = "resources/drive/binaries/training"
split = "training" 
; Evaluation will run on the first num_maps maps in the map_dir directory
num_maps = 20
backend = PufferEnv
; WOSAC (Waymo Open Sim Agents Challenge) evaluation settings
; If True, enables evaluation on realism metrics each time we save a checkpoint
wosac_realism_eval = False
; Number of policy rollouts per scene
wosac_num_rollouts = 32
; When to start the simulation
wosac_init_steps = 10
; Control everything valid at init in the scene
wosac_control_mode = "control_wosac"
; Create everything in valid at init the scene
wosac_init_mode = "create_all_valid"
; Stop when reaching the goal
wosac_goal_behavior = 2
; Can shrink goal radius for WOSAC evaluation
wosac_goal_radius = 2.0
wosac_sanity_check = False
; Only return aggregate results across all scenes
wosac_aggregate_results = True
; If True, enable human replay evaluation (pair policy-controlled agent with human replays)
human_replay_eval = False
; Control only the self-driving car
human_replay_control_mode = "control_sdc_only"

[sweep.train.learning_rate]
distribution = log_normal
min = 0.001
mean = 0.003
max = 0.005
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
mean = 0.005
max = 0.03
scale = auto

[sweep.train.gamma]
distribution = log_normal
min = 0.97
mean = 0.98
max = 0.999
scale = auto

[sweep.train.gae_lambda]
distribution = log_normal
min = 0.95
mean = 0.98
max = 0.999
scale = auto

[controlled_exp.train.goal_speed]
values = [10, 20, 30, 3]

[controlled_exp.train.ent_coef]
values = [0.001, 0.005, 0.01]

[controlled_exp.train.seed]
values = [42, 55, 1]
