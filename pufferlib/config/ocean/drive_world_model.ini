[base]
package = ocean
env_name = puffer_drive
policy_name = DriveLatentWorldModel
rnn_name = LatentWorldModelWrapper

[vec]
num_workers = 16
num_envs = 16
batch_size = 4

[policy]
input_size = 64
hidden_size = 256
transition_loss_coef = 1.0

[rnn]
input_size = 256
hidden_size = 256
imagination_horizon = 4

[env]
num_agents = 1024
action_type =  discrete
dynamics_model = classic
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
reward_speed_limit = 0.0
dt = 0.1
collision_shrink = 1.0
reward_goal = 1.0
reward_goal_post_respawn = 0.25
goal_radius = 2.0
goal_speed = 100.0
goal_behavior = 3
goal_target_distance = 30.0
collision_behavior = 2
offroad_behavior = 2
episode_length = 151
resample_frequency = 1510
split = "training"
termination_mode = 1
num_maps = 139510
init_steps = 0
control_mode = "control_vehicles"
init_mode = "create_all_valid"
idm_others = False
max_controlled_agents = -1
max_obs_partners = 31
traffic_mix = ppo:1.0
idm_target_velocity = 15.0
idm_random_velocity = False

[train]
seed=42
total_timesteps = 2_000_000_000
anneal_lr = True
batch_size = 524288
minibatch_size = 32768
max_minibatch_size = 32768
bptt_horizon = 32
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.005
gae_lambda = 0.95
gamma = 0.98
learning_rate = 0.003
max_grad_norm = 1
prio_alpha = 0.8499999999999999
prio_beta0 = 0.8499999999999999
update_epochs = 1
vf_clip_coef = 0.1999999999999999
vf_coef = 2
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 1000
teacher_only = False
teacher_bc_kl_coef = 0.01
bc_weights_path =
kl_coef = 0.1
smart_ref_weights_path =
smart_ref_shift = 5
humanlike_coef = 0.1
render = False
render_interval = 1000
obs_only = True
show_grid = True
show_lasers = False
show_human_logs = False
zoom_in = True
render_map = none

[eval]
eval_interval = 1000
split = "training"
num_maps = 20
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
human_replay_eval = False
human_replay_control_mode = "control_sdc_only"
