[data]
train_split = training
val_split = validation
max_train_files = -1
max_val_files = -1
cache_dir = /data/ag_nr/share/smart_cache_vru
batch_size = 4
num_workers = 4
max_agents = -1
num_historical_steps = 11
num_future_steps = 80
shift = 5
data_dir = /data/ag_nr/share/binaries_full

[model]
input_dim = 2
hidden_dim = 64
num_historical_steps = 11
num_future_steps = 80
num_actions = 2048
shift = 5
pl2pl_radius = 10.0
pl2a_radius = 30.0
a2a_radius = 60.0
num_freq_bands = 32
num_map_layers = 2
num_agent_layers = 2
num_heads = 4
head_dim = 16
time_span = 30
dropout = 0.1
hist_drop_prob = 0.1
label_smoothing = 0.1

[train]
device = cuda
max_epochs = 100
learning_rate = 5e-4
lr_min_ratio = 0.01
weight_decay = 0.01
warmup_epochs = 0
max_grad_norm = 0.5
checkpoint_interval = 5
checkpoint_dir = experiments/prediction/smart_1M
traj_eval_interval = 1

[finetune]
pretrain_ckpt = experiments/prediction/smart_1M/epoch_100.pt
transition_dir = experiments/transitions
max_epochs = 50
learning_rate = 1e-4
batch_size = 32
mix_ratio = 0.5
checkpoint_interval = 5
