; =============================================================================
; Save trajectories for PBT replay / zeroshot evaluation
; =============================================================================
; Layer on top of a drive training config, e.g.:
;   python pufferlib/ocean/benchmark/save_trajectories.py \
;     --config config/ocean/drive_gigaflow_pbt.ini \
;     --trajectories.mode save-replay \
;     --load-multiple-model-path /path/ego.pt /path/other.pt
;
; Modes (trajectories.mode):
;   save-replay       - ego vs other; N rollouts -> other_actions.npz (N>1) or .npy (N=1)
;   save-population   - roll population policies; save other_actions.npz for replay training
;   replay-test       - load other_actions.npz and sanity-check replay_rollouts
; =============================================================================

[trajectories]
; save-replay | save-population | replay-test
mode = save-replay
; Rollouts for save-replay (CLI: --num-rollouts). Default 1 -> other_actions.npy
num_rollouts = 1
; One rollout per map in order: map_id 0 .. num_maps-1 (overrides num_rollouts)
sequential_maps = False
; Root for artifacts (replay buffers, metrics json). Defaults to pbt.population_path/replay
output_dir =
; After save-population, run replay_rollouts on each saved shard
verify_replay = True
; Optional explicit npz for replay-test (else population_path/replay/other_actions.npz)
replay_npz =

[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
rnn_name = Recurrent

[vec]
backend = PufferEnv
num_envs = 1
num_workers = 1
batch_size = 1
zero_copy = True

[eval]
backend = PufferEnv
split = training
num_maps = 100

[pbt]
pbt_mode = save-population
population_path = /data/puffer/popul_lane_nominal/
ego_ratio = 0.25
num_collect_rollout = 50
collect_start_idx = 0
collect_end_idx = 50
